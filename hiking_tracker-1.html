<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>산길 기록기</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1117; --surface: #1a1d27; --surface2: #22263a;
      --border: #2e3347; --accent: #4ade80; --accent2: #60a5fa;
      --warn: #f59e0b; --danger: #f87171; --text: #e8eaf0;
      --text-muted: #7b82a0;
      --font-ui: 'Noto Sans KR', sans-serif;
      --font-mono: 'Space Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--font-ui); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

    /* 탭 헤더 */
    header { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; z-index: 1000; gap: 8px; }
    .logo { font-family: var(--font-mono); font-size: 14px; font-weight: 700; color: var(--accent); white-space: nowrap; }
    .logo span { color: var(--text-muted); }
    #status-badge { font-family: var(--font-mono); font-size: 10px; padding: 3px 8px; border-radius: 20px; background: var(--surface2); border: 1px solid var(--border); color: var(--text-muted); transition: all 0.3s; white-space: nowrap; }
    #status-badge.recording { background: rgba(74,222,128,0.12); border-color: var(--accent); color: var(--accent); animation: pulse-border 2s infinite; }
    @keyframes pulse-border { 0%,100%{box-shadow:0 0 0 0 rgba(74,222,128,0.3)}50%{box-shadow:0 0 0 4px rgba(74,222,128,0)} }

    /* 탭 버튼 */
    #tabs { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .tab-btn { flex: 1; padding: 10px; font-family: var(--font-ui); font-size: 12px; font-weight: 700; background: none; border: none; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* 화면 */
    .screen { display: none; flex: 1; flex-direction: column; overflow: hidden; }
    .screen.active { display: flex; }

    /* 지도 화면 */
    #map { flex: 1; z-index: 1; }
    #panel { background: var(--surface); border-top: 1px solid var(--border); padding: 12px 14px; flex-shrink: 0; z-index: 1000; }
    #stats-row { display: flex; gap: 6px; margin-bottom: 10px; }
    .stat-box { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 7px 6px; text-align: center; }
    .stat-label { font-size: 9px; color: var(--text-muted); margin-bottom: 2px; }
    .stat-value { font-family: var(--font-mono); font-size: 13px; font-weight: 700; }
    .stat-value.highlight { color: var(--accent); }
    #btn-row { display: flex; gap: 8px; }
    .btn { flex: 1; padding: 12px; border: none; border-radius: 12px; font-family: var(--font-ui); font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
    .btn:active { transform: scale(0.97); }
    #btn-start { background: var(--accent); color: #0f1117; }
    #btn-stop { background: var(--danger); color: #0f1117; display: none; }
    #btn-locate { flex: 0 0 46px; background: var(--surface2); border: 1px solid var(--border); color: var(--text); font-size: 17px; padding: 0; }
    #btn-db { flex: 0 0 46px; background: var(--surface2); border: 1px solid var(--border); color: var(--accent2); font-size: 17px; padding: 0; }

    /* 데이터베이스 화면 */
    #db-screen { overflow-y: auto; padding: 14px; gap: 10px; }
    #db-screen h2 { font-family: var(--font-mono); font-size: 14px; color: var(--accent2); margin-bottom: 4px; }
    #db-screen p { font-size: 11px; color: var(--text-muted); margin-bottom: 12px; }
    #btn-load-routes { width: 100%; padding: 12px; background: var(--accent2); color: #0f1117; border: none; border-radius: 12px; font-family: var(--font-ui); font-size: 13px; font-weight: 700; cursor: pointer; margin-bottom: 12px; }
    #routes-list { display: flex; flex-direction: column; gap: 8px; }
    .route-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 12px; cursor: pointer; transition: all 0.2s; }
    .route-card:hover { border-color: var(--accent2); }
    .route-card.selected { border-color: var(--accent2); background: rgba(96,165,250,0.1); }
    .route-card-title { font-weight: 700; font-size: 13px; margin-bottom: 4px; }
    .route-card-meta { font-size: 11px; color: var(--text-muted); }

    /* GPS 데이터 화면 */
    #data-screen { overflow-y: auto; padding: 14px; gap: 10px; }
    #data-screen h2 { font-family: var(--font-mono); font-size: 14px; color: var(--warn); margin-bottom: 4px; }
    #data-screen p { font-size: 11px; color: var(--text-muted); margin-bottom: 12px; }
    #btn-load-data { width: 100%; padding: 12px; background: var(--warn); color: #0f1117; border: none; border-radius: 12px; font-family: var(--font-ui); font-size: 13px; font-weight: 700; cursor: pointer; margin-bottom: 8px; }
    #btn-download-csv { width: 100%; padding: 12px; background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 12px; font-family: var(--font-ui); font-size: 13px; font-weight: 700; cursor: pointer; margin-bottom: 12px; display: none; }
    #data-table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 11px; font-family: var(--font-mono); }
    th { background: var(--surface2); color: var(--text-muted); padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--border); }
    td { padding: 5px 8px; border-bottom: 1px solid var(--border); color: var(--text); }
    tr:hover td { background: var(--surface2); }

    /* 토스트 */
    #toast { position: fixed; bottom: 160px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--surface2); border: 1px solid var(--border); color: var(--text); font-size: 12px; padding: 9px 16px; border-radius: 20px; opacity: 0; transition: all 0.3s; z-index: 9000; white-space: nowrap; pointer-events: none; }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.warn { border-color: var(--warn); color: var(--warn); }
    #toast.ok   { border-color: var(--accent); color: var(--accent); }

    /* 요약 모달 */
    #summary-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 8000; align-items: center; justify-content: center; }
    #summary-overlay.show { display: flex; }
    #summary-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 24px 20px; width: min(340px, 92vw); animation: slide-up 0.3s ease; }
    @keyframes slide-up { from{transform:translateY(30px);opacity:0} to{transform:translateY(0);opacity:1} }
    #summary-card h2 { font-size: 16px; font-weight: 700; margin-bottom: 6px; color: var(--accent); font-family: var(--font-mono); }
    #summary-card p { font-size: 11px; color: var(--text-muted); margin-bottom: 16px; }
    .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .summary-item { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 10px; }
    .s-label { font-size: 10px; color: var(--text-muted); margin-bottom: 4px; }
    .s-val { font-family: var(--font-mono); font-size: 18px; font-weight: 700; }
    #nickname-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    #nickname-row label { font-size: 11px; color: var(--text-muted); }
    #inp-nickname, #inp-title { width: 100%; padding: 10px 12px; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-family: var(--font-ui); font-size: 13px; outline: none; }
    #inp-nickname:focus, #inp-title:focus { border-color: var(--accent); }
    #btn-save-route { width: 100%; padding: 13px; background: var(--accent); color: #0f1117; border: none; border-radius: 12px; font-family: var(--font-ui); font-size: 13px; font-weight: 700; cursor: pointer; margin-bottom: 8px; }
    #btn-skip-save { width: 100%; padding: 10px; background: none; border: 1px solid var(--border); border-radius: 12px; font-family: var(--font-ui); font-size: 12px; color: var(--text-muted); cursor: pointer; }

    .leaflet-tile { filter: brightness(0.85) saturate(0.9); }
    .leaflet-container { background: #1a1d27; }

    /* 로딩 */
    .loading { text-align: center; color: var(--text-muted); font-size: 12px; padding: 20px; }
  </style>
</head>
<body>

<header>
  <div class="logo">⛰ 산길<span>기록기</span></div>
  <div id="status-badge">대기 중</div>
</header>

<div id="tabs">
  <button class="tab-btn active" onclick="switchTab('map')">🗺 지도</button>
  <button class="tab-btn" onclick="switchTab('db')">🌐 경로 DB</button>
  <button class="tab-btn" onclick="switchTab('data')">📊 좌표 데이터</button>
</div>

<!-- 지도 화면 -->
<div id="map-screen" class="screen active">
  <div id="map"></div>
  <div id="panel">
    <div id="stats-row">
      <div class="stat-box"><div class="stat-label">이동 거리</div><div class="stat-value highlight" id="stat-dist">0 m</div></div>
      <div class="stat-box"><div class="stat-label">기록 지점</div><div class="stat-value" id="stat-points">0</div></div>
      <div class="stat-box"><div class="stat-label">경과 시간</div><div class="stat-value" id="stat-time">00:00</div></div>
      <div class="stat-box"><div class="stat-label">GPS 정확도</div><div class="stat-value" id="stat-acc">—</div></div>
    </div>
    <div id="btn-row">
      <button class="btn" id="btn-locate">📍</button>
      <button class="btn" id="btn-start">등산 시작</button>
      <button class="btn" id="btn-stop">등산 종료</button>
    </div>
  </div>
</div>

<!-- 경로 DB 화면 -->
<div id="db-screen" class="screen">
  <h2>// 경로 데이터베이스</h2>
  <p>저장된 모든 등산 경로를 지도에서 확인할 수 있어요.</p>
  <button id="btn-load-routes" onclick="loadAllRoutes()">🔄 전체 경로 불러오기</button>
  <div id="routes-list"><div class="loading">버튼을 눌러 경로를 불러오세요.</div></div>
</div>

<!-- GPS 좌표 데이터 화면 -->
<div id="data-screen" class="screen">
  <h2>// GPS 좌표 데이터</h2>
  <p>저장된 모든 GPS 좌표를 확인하고 CSV로 다운로드할 수 있어요.</p>
  <button id="btn-load-data" onclick="loadAllPoints()">🔄 전체 좌표 불러오기</button>
  <button id="btn-download-csv" onclick="downloadCSV()">⬇ CSV 다운로드</button>
  <div id="data-table-wrap"><div class="loading">버튼을 눌러 좌표를 불러오세요.</div></div>
</div>

<div id="toast"></div>

<!-- 요약 + 저장 모달 -->
<div id="summary-overlay">
  <div id="summary-card">
    <h2>// 등산 완료</h2>
    <p>경로를 데이터베이스에 저장할 수 있어요.</p>
    <div class="summary-grid">
      <div class="summary-item"><div class="s-label">총 이동 거리</div><div class="s-val" id="s-dist">—</div></div>
      <div class="summary-item"><div class="s-label">소요 시간</div><div class="s-val" id="s-time">—</div></div>
      <div class="summary-item"><div class="s-label">기록 지점 수</div><div class="s-val" id="s-points">—</div></div>
      <div class="summary-item"><div class="s-label">평균 정확도</div><div class="s-val" id="s-acc">—</div></div>
    </div>
    <div id="nickname-row">
      <label>닉네임</label>
      <input id="inp-nickname" type="text" placeholder="닉네임 입력 (예: 홍길동)">
      <label>경로 이름</label>
      <input id="inp-title" type="text" placeholder="경로 이름 (예: 지리산 천왕봉)">
    </div>
    <button id="btn-save-route" onclick="saveRoute()">💾 Supabase에 저장</button>
    <button id="btn-skip-save" onclick="closeSummary()">저장하지 않고 닫기</button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ── Supabase 설정 ──────────────────────────────────────
const SUPABASE_URL = 'https://ocrtwcrpejqcwewvipgd.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9jcnR3Y3JwZWpxY3dld3ZpcGdkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2NTUxNTEsImV4cCI6MjA5NjIzMTE1MX0.Dw7U8PLHbOJPDBQIdVSzEdxFtlQqq8Z-k6kYNFFbARo';

async function sbFetch(path, method = 'GET', body = null) {
  const opts = {
    method,
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json',
      'Prefer': method === 'POST' ? 'return=representation' : '',
    },
  };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, opts);
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

// ── 상수 ──────────────────────────────────────────────
const INTERVAL_SEC  = 10;
const GYEONGNAM_SCI = [35.2867, 128.6731];
const ROUTE_COLORS  = ['#4ade80','#60a5fa','#f59e0b','#f87171','#a78bfa','#34d399','#fb923c'];

// ── 상태 ──────────────────────────────────────────────
let map, currentPolyline, currentMarker;
let dbPolylines = [];
let recording = false;
let points = [], accuracyList = [];
let intervalId = null, timerIntervalId = null;
let startTime = null, elapsedSec = 0;
let watchId = null, latestPos = null;
let allPointsCache = [];

// ── 탭 전환 ───────────────────────────────────────────
function switchTab(tab) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(tab + '-screen').classList.add('active');
  event.target.classList.add('active');
  if (tab === 'map') setTimeout(() => map.invalidateSize(), 100);
}

// ── 지도 초기화 ───────────────────────────────────────
function initMap() {
  map = L.map('map', { zoomControl: true }).setView(GYEONGNAM_SCI, 14);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    minZoom: 10, maxZoom: 17,
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  }).addTo(map);
  currentPolyline = L.polyline([], { color: '#4ade80', weight: 4, opacity: 0.9 }).addTo(map);
}

// ── GPS 감시 (1회) ────────────────────────────────────
function startWatching() {
  if (!navigator.geolocation || watchId !== null) return;
  watchId = navigator.geolocation.watchPosition(
    (pos) => {
      latestPos = pos;
      document.getElementById('stat-acc').textContent = Math.round(pos.coords.accuracy) + ' m';
      if (!recording) updateCurrentMarker([pos.coords.latitude, pos.coords.longitude]);
    },
    (err) => showToast('위치 오류: ' + err.message, 'warn'),
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 5000 }
  );
}

// ── 포인트 저장 ───────────────────────────────────────
function savePoint() {
  if (!latestPos) { showToast('GPS 신호 대기 중...', 'warn'); return; }
  const { latitude, longitude, accuracy, altitude } = latestPos.coords;
  const latlng = [latitude, longitude];
  points.push({ latlng, accuracy, altitude: altitude || 0, timestamp: new Date().toISOString() });
  accuracyList.push(accuracy);
  currentPolyline.addLatLng(latlng);
  updateCurrentMarker(latlng);
  document.getElementById('stat-points').textContent = points.length;
  document.getElementById('stat-dist').textContent = formatDist(calcTotalDist());
  showToast(`📍 포인트 ${points.length} 기록`, 'ok');
}

// ── 마커 ──────────────────────────────────────────────
function updateCurrentMarker(latlng) {
  const icon = L.divIcon({
    className: '',
    html: `<div style="width:14px;height:14px;background:#4ade80;border:2px solid #fff;border-radius:50%;box-shadow:0 0 8px rgba(74,222,128,0.8)"></div>`,
    iconSize: [14,14], iconAnchor: [7,7],
  });
  if (currentMarker) map.removeLayer(currentMarker);
  currentMarker = L.marker(latlng, { icon }).addTo(map);
  map.panTo(latlng);
}

// ── 거리 계산 ─────────────────────────────────────────
function haversine([lat1,lon1],[lat2,lon2]) {
  const R=6371000, φ1=lat1*Math.PI/180, φ2=lat2*Math.PI/180;
  const Δφ=(lat2-lat1)*Math.PI/180, Δλ=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(Δφ/2)**2+Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function calcTotalDist() {
  let t=0; for(let i=1;i<points.length;i++) t+=haversine(points[i-1].latlng,points[i].latlng); return t;
}
function formatDist(m) { return m>=1000?(m/1000).toFixed(2)+' km':Math.round(m)+' m'; }

// ── 타이머 ────────────────────────────────────────────
function startTimer() {
  startTime = Date.now();
  timerIntervalId = setInterval(() => {
    elapsedSec = Math.floor((Date.now()-startTime)/1000);
    const m=String(Math.floor(elapsedSec/60)).padStart(2,'0');
    const s=String(elapsedSec%60).padStart(2,'0');
    document.getElementById('stat-time').textContent=`${m}:${s}`;
  }, 1000);
}

// ── 등산 시작 ─────────────────────────────────────────
function startRecording() {
  recording=true; points=[]; accuracyList=[]; elapsedSec=0;
  currentPolyline.setLatLngs([]);
  if(currentMarker){map.removeLayer(currentMarker);currentMarker=null;}
  document.getElementById('btn-start').style.display='none';
  document.getElementById('btn-stop').style.display='flex';
  document.getElementById('status-badge').textContent='● 기록 중';
  document.getElementById('status-badge').classList.add('recording');
  document.getElementById('stat-points').textContent='0';
  document.getElementById('stat-dist').textContent='0 m';
  document.getElementById('stat-time').textContent='00:00';
  startTimer();
  savePoint();
  intervalId=setInterval(savePoint,INTERVAL_SEC*1000);
  showToast('등산 시작! 화면을 끄지 마세요 🏔','ok');
}

// ── 등산 종료 ─────────────────────────────────────────
function stopRecording() {
  recording=false;
  clearInterval(intervalId);
  clearInterval(timerIntervalId);
  document.getElementById('btn-start').style.display='flex';
  document.getElementById('btn-stop').style.display='none';
  document.getElementById('status-badge').textContent='완료';
  document.getElementById('status-badge').classList.remove('recording');
  showSummary();
}

// ── 요약 모달 ─────────────────────────────────────────
function showSummary() {
  const dist=calcTotalDist();
  const avgAcc=accuracyList.length?Math.round(accuracyList.reduce((a,b)=>a+b,0)/accuracyList.length):0;
  const m=String(Math.floor(elapsedSec/60)).padStart(2,'0');
  const s=String(elapsedSec%60).padStart(2,'0');
  document.getElementById('s-dist').textContent=formatDist(dist);
  document.getElementById('s-time').textContent=`${m}:${s}`;
  document.getElementById('s-points').textContent=points.length+' 개';
  document.getElementById('s-acc').textContent=avgAcc+' m';
  document.getElementById('summary-overlay').classList.add('show');
}

function closeSummary() {
  document.getElementById('summary-overlay').classList.remove('show');
}

// ── Supabase 저장 ─────────────────────────────────────
async function saveRoute() {
  const nickname = document.getElementById('inp-nickname').value.trim() || '익명';
  const title    = document.getElementById('inp-title').value.trim()    || '이름 없는 경로';
  if (points.length < 2) { showToast('기록된 좌표가 너무 적어요 (최소 2개)', 'warn'); return; }

  document.getElementById('btn-save-route').textContent = '저장 중...';
  document.getElementById('btn-save-route').disabled = true;

  try {
    const dist = calcTotalDist();
    const now  = new Date().toISOString();

    // 1. routes 테이블에 경로 저장
    const routeRes = await sbFetch('routes', 'POST', {
      nickname, title,
      started_at: points[0].timestamp,
      ended_at: points[points.length-1].timestamp,
      total_distance_m: Math.round(dist),
      duration_min: Math.round(elapsedSec/60),
      created_at: now,
    });

    const routeId = routeRes[0].id;

    // 2. route_points 테이블에 좌표 저장
    const pointRows = points.map((p, i) => ({
      route_id: routeId,
      point_order: i,
      latitude: p.latlng[0],
      longitude: p.latlng[1],
      altitude: p.altitude,
      accuracy: p.accuracy,
      timestamp: p.timestamp,
    }));
    await sbFetch('route_points', 'POST', pointRows);

    showToast('저장 완료! 🎉', 'ok');
    closeSummary();
  } catch(e) {
    showToast('저장 실패: ' + e.message, 'warn');
    console.error(e);
  } finally {
    document.getElementById('btn-save-route').textContent = '💾 Supabase에 저장';
    document.getElementById('btn-save-route').disabled = false;
  }
}

// ── 전체 경로 불러와서 지도에 표시 ───────────────────
async function loadAllRoutes() {
  document.getElementById('routes-list').innerHTML = '<div class="loading">불러오는 중...</div>';
  dbPolylines.forEach(p => map.removeLayer(p));
  dbPolylines = [];

  try {
    const routes = await sbFetch('routes?select=*&order=created_at.desc');
    if (!routes.length) {
      document.getElementById('routes-list').innerHTML = '<div class="loading">저장된 경로가 없어요.</div>';
      return;
    }

    // 모든 경로의 포인트를 한 번에 가져오기
    const points_all = await sbFetch('route_points?select=*&order=route_id,point_order');

    // route_id 기준으로 그룹화
    const grouped = {};
    points_all.forEach(p => {
      if (!grouped[p.route_id]) grouped[p.route_id] = [];
      grouped[p.route_id].push([p.latitude, p.longitude]);
    });

    // 지도에 폴리라인 그리기
    routes.forEach((route, i) => {
      const latlngs = grouped[route.id] || [];
      if (latlngs.length < 2) return;
      const color = ROUTE_COLORS[i % ROUTE_COLORS.length];
      const pl = L.polyline(latlngs, { color, weight: 3, opacity: 0.8 })
        .bindTooltip(`${route.title} (${route.nickname})`)
        .addTo(map);
      dbPolylines.push(pl);
    });

    // 경로 목록 렌더링
    const listEl = document.getElementById('routes-list');
    listEl.innerHTML = '';
    routes.forEach((route, i) => {
      const color = ROUTE_COLORS[i % ROUTE_COLORS.length];
      const card = document.createElement('div');
      card.className = 'route-card';
      card.innerHTML = `
        <div class="route-card-title" style="color:${color}">■ ${route.title}</div>
        <div class="route-card-meta">
          👤 ${route.nickname} &nbsp;|&nbsp;
          📏 ${route.total_distance_m >= 1000 ? (route.total_distance_m/1000).toFixed(2)+'km' : route.total_distance_m+'m'} &nbsp;|&nbsp;
          ⏱ ${route.duration_min}분
        </div>
        <div class="route-card-meta" style="margin-top:2px">
          🕐 ${new Date(route.created_at).toLocaleString('ko-KR')}
        </div>
      `;
      card.onclick = () => {
        // 지도 탭으로 이동 + 해당 경로로 줌
        document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
        document.getElementById('map-screen').classList.add('active');
        document.querySelector('.tab-btn').classList.add('active');
        setTimeout(() => {
          map.invalidateSize();
          const latlngs = grouped[route.id] || [];
          if (latlngs.length) map.fitBounds(L.latLngBounds(latlngs));
        }, 150);
      };
      listEl.appendChild(card);
    });

    showToast(`경로 ${routes.length}개 불러옴`, 'ok');
  } catch(e) {
    document.getElementById('routes-list').innerHTML = '<div class="loading">오류: ' + e.message + '</div>';
  }
}

// ── 전체 좌표 데이터 불러오기 ─────────────────────────
async function loadAllPoints() {
  document.getElementById('data-table-wrap').innerHTML = '<div class="loading">불러오는 중...</div>';
  document.getElementById('btn-download-csv').style.display = 'none';

  try {
    const routes = await sbFetch('routes?select=id,title,nickname');
    const routeMap = {};
    routes.forEach(r => routeMap[r.id] = { title: r.title, nickname: r.nickname });

    allPointsCache = await sbFetch('route_points?select=*&order=route_id,point_order');

    if (!allPointsCache.length) {
      document.getElementById('data-table-wrap').innerHTML = '<div class="loading">저장된 좌표가 없어요.</div>';
      return;
    }

    // 테이블 렌더링
    let html = `<table>
      <tr>
        <th>경로명</th><th>닉네임</th><th>순서</th>
        <th>위도</th><th>경도</th><th>고도(m)</th>
        <th>정확도(m)</th><th>시각</th>
      </tr>`;
    allPointsCache.forEach(p => {
      const r = routeMap[p.route_id] || { title:'?', nickname:'?' };
      html += `<tr>
        <td>${r.title}</td><td>${r.nickname}</td><td>${p.point_order}</td>
        <td>${p.latitude.toFixed(6)}</td><td>${p.longitude.toFixed(6)}</td>
        <td>${p.altitude ? p.altitude.toFixed(1) : '—'}</td>
        <td>${p.accuracy ? Math.round(p.accuracy) : '—'}</td>
        <td>${new Date(p.timestamp).toLocaleString('ko-KR')}</td>
      </tr>`;
    });
    html += '</table>';
    document.getElementById('data-table-wrap').innerHTML = html;
    document.getElementById('btn-download-csv').style.display = 'block';
    showToast(`좌표 ${allPointsCache.length}개 불러옴`, 'ok');
  } catch(e) {
    document.getElementById('data-table-wrap').innerHTML = '<div class="loading">오류: ' + e.message + '</div>';
  }
}

// ── CSV 다운로드 ──────────────────────────────────────
async function downloadCSV() {
  if (!allPointsCache.length) return;
  const routes = await sbFetch('routes?select=id,title,nickname');
  const routeMap = {};
  routes.forEach(r => routeMap[r.id] = { title: r.title, nickname: r.nickname });

  let csv = 'route_title,nickname,point_order,latitude,longitude,altitude,accuracy,timestamp\n';
  allPointsCache.forEach(p => {
    const r = routeMap[p.route_id] || { title:'', nickname:'' };
    csv += `"${r.title}","${r.nickname}",${p.point_order},${p.latitude},${p.longitude},${p.altitude||''},${p.accuracy||''},"${p.timestamp}"\n`;
  });

  const blob = new Blob(['\uFEFF'+csv], { type: 'text/csv;charset=utf-8;' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = `hiking_gps_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('CSV 다운로드 완료', 'ok');
}

// ── 현재 위치로 이동 ──────────────────────────────────
function locateMe() {
  if (latestPos) {
    map.setView([latestPos.coords.latitude, latestPos.coords.longitude], 15);
    showToast('현재 위치로 이동했어요.', 'ok');
  } else {
    showToast('아직 위치를 받아오는 중이에요.', 'warn');
  }
}

// ── 토스트 ────────────────────────────────────────────
let toastTimer;
function showToast(msg, type='') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show' + (type?' '+type:'');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className=''; }, 2800);
}

// ── 이벤트 ────────────────────────────────────────────
document.getElementById('btn-start').addEventListener('click', startRecording);
document.getElementById('btn-stop').addEventListener('click', stopRecording);
document.getElementById('btn-locate').addEventListener('click', locateMe);

// ── 시작 ──────────────────────────────────────────────
initMap();
startWatching();
</script>
