<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>산길 기록기</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3347;
      --accent: #4ade80;
      --accent2: #60a5fa;
      --warn: #f59e0b;
      --danger: #f87171;
      --text: #e8eaf0;
      --text-muted: #7b82a0;
      --font-ui: 'Noto Sans KR', sans-serif;
      --font-mono: 'Space Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── 헤더 ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 1000;
    }

    .logo {
      font-family: var(--font-mono);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--accent);
    }

    .logo span { color: var(--text-muted); }

    #status-badge {
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 20px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      transition: all 0.3s;
    }

    #status-badge.recording {
      background: rgba(74,222,128,0.12);
      border-color: var(--accent);
      color: var(--accent);
      animation: pulse-border 2s infinite;
    }

    @keyframes pulse-border {
      0%, 100% { box-shadow: 0 0 0 0 rgba(74,222,128,0.3); }
      50% { box-shadow: 0 0 0 4px rgba(74,222,128,0); }
    }

    /* ── 지도 ── */
    #map {
      flex: 1;
      z-index: 1;
    }

    /* ── 하단 패널 ── */
    #panel {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 14px 16px;
      flex-shrink: 0;
      z-index: 1000;
    }

    /* 통계 행 */
    #stats-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .stat-box {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      text-align: center;
    }

    .stat-label {
      font-size: 10px;
      color: var(--text-muted);
      margin-bottom: 3px;
      letter-spacing: 0.04em;
    }

    .stat-value {
      font-family: var(--font-mono);
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }

    .stat-value.highlight { color: var(--accent); }

    /* 버튼 행 */
    #btn-row {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 13px;
      border: none;
      border-radius: 12px;
      font-family: var(--font-ui);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.02em;
    }

    .btn:active { transform: scale(0.97); }

    #btn-start {
      background: var(--accent);
      color: #0f1117;
    }

    #btn-start:hover:not(:disabled) { background: #86efac; }

    #btn-stop {
      background: var(--danger);
      color: #0f1117;
      display: none;
    }

    #btn-stop:hover:not(:disabled) { background: #fca5a5; }

    #btn-locate {
      flex: 0 0 48px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 18px;
      padding: 0;
    }

    #btn-locate:hover { background: var(--border); }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* 알림 토스트 */
    #toast {
      position: fixed;
      bottom: 180px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 13px;
      padding: 10px 18px;
      border-radius: 20px;
      opacity: 0;
      transition: all 0.3s;
      z-index: 2000;
      white-space: nowrap;
      pointer-events: none;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #toast.warn { border-color: var(--warn); color: var(--warn); }
    #toast.ok   { border-color: var(--accent); color: var(--accent); }

    /* 요약 모달 */
    #summary-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 3000;
      align-items: center;
      justify-content: center;
    }

    #summary-overlay.show { display: flex; }

    #summary-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px 24px;
      width: min(340px, 90vw);
      animation: slide-up 0.3s ease;
    }

    @keyframes slide-up {
      from { transform: translateY(30px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    #summary-card h2 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 20px;
      color: var(--accent);
      font-family: var(--font-mono);
    }

    .summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    .summary-item {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 12px;
    }

    .summary-item .s-label {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    .summary-item .s-val {
      font-family: var(--font-mono);
      font-size: 20px;
      font-weight: 700;
    }

    #btn-close-summary {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: #0f1117;
      border: none;
      border-radius: 12px;
      font-family: var(--font-ui);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Leaflet 다크 오버라이드 */
    .leaflet-tile { filter: brightness(0.85) saturate(0.9); }
    .leaflet-container { background: #1a1d27; }
  </style>
</head>
<body>

<header>
  <div class="logo">⛰ 산길<span>기록기</span></div>
  <div id="status-badge">대기 중</div>
</header>

<div id="map"></div>

<div id="panel">
  <div id="stats-row">
    <div class="stat-box">
      <div class="stat-label">이동 거리</div>
      <div class="stat-value highlight" id="stat-dist">0 m</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">기록 지점</div>
      <div class="stat-value" id="stat-points">0</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">경과 시간</div>
      <div class="stat-value" id="stat-time">00:00</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">GPS 정확도</div>
      <div class="stat-value" id="stat-acc">—</div>
    </div>
  </div>
  <div id="btn-row">
    <button class="btn" id="btn-locate">📍</button>
    <button class="btn" id="btn-start">등산 시작</button>
    <button class="btn" id="btn-stop">등산 종료</button>
  </div>
</div>

<div id="toast"></div>

<div id="summary-overlay">
  <div id="summary-card">
    <h2>// 등산 완료</h2>
    <div class="summary-grid">
      <div class="summary-item">
        <div class="s-label">총 이동 거리</div>
        <div class="s-val" id="s-dist">—</div>
      </div>
      <div class="summary-item">
        <div class="s-label">소요 시간</div>
        <div class="s-val" id="s-time">—</div>
      </div>
      <div class="summary-item">
        <div class="s-label">기록 지점 수</div>
        <div class="s-val" id="s-points">—</div>
      </div>
      <div class="summary-item">
        <div class="s-label">평균 정확도</div>
        <div class="s-val" id="s-acc">—</div>
      </div>
    </div>
    <button id="btn-close-summary">확인</button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ── 상수 ──────────────────────────────────────────────
const INTERVAL_SEC     = 10;   // 테스트: 10초 | 실제: 60
const ACCURACY_LIMIT_M = 50;   // 이 값(m)을 초과하면 포인트 스킵
const GYEONGNAM_SCI    = [35.2867, 128.6731]; // 경남과학고 좌표 (기본 위치)
const ROUTE_COLOR      = '#4ade80';

// ── 상태 ──────────────────────────────────────────────
let map, polyline, currentMarker;
let recording       = false;
let points          = [];       // { latlng, accuracy, timestamp }
let intervalId      = null;
let timerIntervalId = null;
let startTime       = null;
let elapsedSec      = 0;
let accuracyList    = [];

// watchPosition 관련 — 앱 전체에서 딱 하나만 유지
let watchId         = null;     // navigator.geolocation.watchPosition 핸들
let latestPos       = null;     // watchPosition이 마지막으로 받은 위치

// ── 지도 초기화 ───────────────────────────────────────
function initMap() {
  map = L.map('map', { zoomControl: true }).setView(GYEONGNAM_SCI, 14);

  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    minZoom: 10,
    maxZoom: 17,
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  }).addTo(map);

  polyline = L.polyline([], {
    color: ROUTE_COLOR,
    weight: 4,
    opacity: 0.9,
  }).addTo(map);
}

// ── GPS 감시 시작 (앱 최초 1회) ───────────────────────
// watchPosition은 권한을 한 번만 요청하고 위치를 계속 수신한다.
// 받은 위치는 latestPos에 저장해두고, 실제 기록은 savePoint()에서 처리한다.
function startWatching() {
  if (!navigator.geolocation) {
    showToast('이 브라우저는 GPS를 지원하지 않아요.', 'warn');
    return;
  }
  if (watchId !== null) return; // 이미 감시 중이면 중복 실행 방지

  watchId = navigator.geolocation.watchPosition(
    (pos) => {
      latestPos = pos;
      const acc = Math.round(pos.coords.accuracy);
      document.getElementById('stat-acc').textContent = acc + ' m';
      // 기록 중이 아닐 때도 현재 마커 위치는 실시간으로 갱신
      if (!recording) {
        updateCurrentMarker(
          [pos.coords.latitude, pos.coords.longitude],
          pos.coords.accuracy
        );
      }
    },
    (err) => {
      showToast('위치 오류: ' + err.message, 'warn');
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 5000 }
  );
}

// ── 포인트 저장 (Timer에서 호출) ──────────────────────
// latestPos에 담긴 최신 위치를 꺼내 기록한다.
// getCurrentPosition()을 매번 호출하지 않으므로 권한 팝업이 다시 뜨지 않는다.
function savePoint() {
  if (!latestPos) {
    showToast('아직 GPS 신호를 받지 못했어요. 잠시 후 다시 시도해요.', 'warn');
    return;
  }

  const { latitude, longitude, accuracy } = latestPos.coords;

  const latlng = [latitude, longitude];
  points.push({ latlng, accuracy, timestamp: Date.now() });
  accuracyList.push(accuracy);

  // 지도 업데이트
  polyline.addLatLng(latlng);
  updateCurrentMarker(latlng, accuracy);

  // 통계 업데이트
  document.getElementById('stat-points').textContent = points.length;
  document.getElementById('stat-dist').textContent   = formatDist(calcTotalDist());

  showToast(`📍 포인트 ${points.length} 기록`, 'ok');
}

// ── 현재 위치 마커 ────────────────────────────────────
function updateCurrentMarker(latlng, accuracy) {
  const icon = L.divIcon({
    className: '',
    html: `<div style="
      width:14px;height:14px;
      background:${ROUTE_COLOR};
      border:2px solid #fff;
      border-radius:50%;
      box-shadow:0 0 8px rgba(74,222,128,0.8);
    "></div>`,
    iconSize: [14, 14],
    iconAnchor: [7, 7],
  });

  if (currentMarker) map.removeLayer(currentMarker);
  currentMarker = L.marker(latlng, { icon }).addTo(map);
  map.panTo(latlng);
}

// ── 거리 계산 (Haversine) ─────────────────────────────
function haversine([lat1, lon1], [lat2, lon2]) {
  const R  = 6371000;
  const φ1 = lat1 * Math.PI / 180;
  const φ2 = lat2 * Math.PI / 180;
  const Δφ = (lat2 - lat1) * Math.PI / 180;
  const Δλ = (lon2 - lon1) * Math.PI / 180;
  const a  = Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function calcTotalDist() {
  let total = 0;
  for (let i = 1; i < points.length; i++)
    total += haversine(points[i-1].latlng, points[i].latlng);
  return total;
}

function formatDist(m) {
  return m >= 1000 ? (m/1000).toFixed(2) + ' km' : Math.round(m) + ' m';
}

// ── 타이머 ────────────────────────────────────────────
function startTimer() {
  startTime = Date.now();
  timerIntervalId = setInterval(() => {
    elapsedSec = Math.floor((Date.now() - startTime) / 1000);
    const m = String(Math.floor(elapsedSec / 60)).padStart(2, '0');
    const s = String(elapsedSec % 60).padStart(2, '0');
    document.getElementById('stat-time').textContent = `${m}:${s}`;
  }, 1000);
}

function stopTimer() {
  clearInterval(timerIntervalId);
}

// ── 등산 시작 ─────────────────────────────────────────
function startRecording() {
  if (!navigator.geolocation) {
    showToast('GPS를 지원하지 않는 브라우저예요.', 'warn');
    return;
  }

  recording    = true;
  points       = [];
  accuracyList = [];
  elapsedSec   = 0;
  polyline.setLatLngs([]);
  if (currentMarker) { map.removeLayer(currentMarker); currentMarker = null; }

  // UI
  document.getElementById('btn-start').style.display = 'none';
  document.getElementById('btn-stop').style.display  = 'flex';
  document.getElementById('status-badge').textContent = '● 기록 중';
  document.getElementById('status-badge').classList.add('recording');
  document.getElementById('stat-points').textContent = '0';
  document.getElementById('stat-dist').textContent   = '0 m';
  document.getElementById('stat-time').textContent   = '00:00';

  startTimer();
  savePoint(); // 즉시 첫 포인트 수집
  intervalId = setInterval(savePoint, INTERVAL_SEC * 1000);

  showToast('등산 시작! 화면을 끄지 마세요 🏔', 'ok');
}

// ── 등산 종료 ─────────────────────────────────────────
function stopRecording() {
  recording = false;
  clearInterval(intervalId);
  stopTimer();

  // UI
  document.getElementById('btn-start').style.display = 'flex';
  document.getElementById('btn-stop').style.display  = 'none';
  document.getElementById('status-badge').textContent = '완료';
  document.getElementById('status-badge').classList.remove('recording');

  showSummary();
}

// ── 요약 모달 ─────────────────────────────────────────
function showSummary() {
  const dist    = calcTotalDist();
  const avgAcc  = accuracyList.length
    ? Math.round(accuracyList.reduce((a,b)=>a+b,0) / accuracyList.length)
    : 0;
  const m = String(Math.floor(elapsedSec / 60)).padStart(2, '0');
  const s = String(elapsedSec % 60).padStart(2, '0');

  document.getElementById('s-dist').textContent   = formatDist(dist);
  document.getElementById('s-time').textContent   = `${m}:${s}`;
  document.getElementById('s-points').textContent = points.length + ' 개';
  document.getElementById('s-acc').textContent    = avgAcc + ' m';

  document.getElementById('summary-overlay').classList.add('show');
}

// ── 현재 위치로 이동 ──────────────────────────────────
// 이미 watchPosition으로 받아놓은 latestPos를 쓰므로 추가 권한 요청 없음
function locateMe() {
  if (latestPos) {
    const latlng = [latestPos.coords.latitude, latestPos.coords.longitude];
    map.setView(latlng, 15);
    showToast('현재 위치로 이동했어요.', 'ok');
  } else {
    showToast('아직 위치를 받아오는 중이에요. 잠시 후 다시 눌러봐요.', 'warn');
  }
}

// ── 토스트 알림 ───────────────────────────────────────
let toastTimer;
function showToast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className   = 'show' + (type ? ' ' + type : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = ''; }, 2800);
}

// ── 이벤트 연결 ───────────────────────────────────────
document.getElementById('btn-start').addEventListener('click', startRecording);
document.getElementById('btn-stop').addEventListener('click', stopRecording);
document.getElementById('btn-locate').addEventListener('click', locateMe);
document.getElementById('btn-close-summary').addEventListener('click', () => {
  document.getElementById('summary-overlay').classList.remove('show');
});

// ── 앱 시작 ───────────────────────────────────────────
initMap();
startWatching(); // 앱 로드 시 GPS 권한을 딱 한 번 요청하고 계속 수신
</script>
</body>
</html>
